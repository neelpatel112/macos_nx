<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Web Emulator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="system-preferences.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="photos.css">
    <link rel="stylesheet" href="music.css">
     <link rel="stylesheet" href="finder.css">
     <link rel="stylesheet" href="calendar.css">
     <link rel="stylesheet" href="github.css">
     <link rel="stylesheet" href="messages.css">
     <link rel="stylesheet" href="safari.css">
     <link rel="stylesheet" href="terminal.css">
</head>
<body>
<div id="lock-screen">
    <div class="ls-clock-container">
        <div id="ls-date">Thursday, May 23</div>
        <div id="ls-time">8:30</div>
    </div>

    <div class="ls-user-section">
        <img src="icons/pfp.png" class="ls-avatar" alt="User">
        <div class="ls-username">Nx4real</div>
        <input type="password" class="ls-login-input" placeholder="Enter Password" id="password-input">
        <div class="ls-hint">Touch ID or Enter Password</div>
    </div>
</div>
    <!-- Desktop Background -->
    <div class="desktop">
        <div class="icon" style="top: 100px; left: 100px;">
            <img src="icons/finder.png" class="desktop-icon">
            <span>Finder</span>
        </div>
        <div class="icon" style="top: 100px; left: 220px;">
            <img src="icons/safari.png" class="desktop-icon">
            <span>Safari</span>
        </div>
        <div class="icon" style="top: 220px; left: 100px;">
            <img src="icons/system.png" class="desktop-icon">
            <span>System Preferences</span>
        </div>
    </div>

    <!-- Menu Bar -->
    <div class="menu-bar">
        <div class="apple-menu">
            <i class="fab fa-apple"></i>
        </div>
        <div class="menu-item">Finder</div>
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Window</div>
        <div class="menu-item">Help</div>
        <div class="status-area">
            <span id="time">10:00 AM</span>
        </div>
    </div>

    <!-- Dock -->
    <div class="dock-container" id="dockContainer"></div>

    <!-- Scripts -->
<!-- Scripts - Reorder them -->
<script src="script.js"></script>
<script src="finder.js"></script>  <!-- This should come before dock.js -->
<script src="dock.js"></script>
<script src="windows.js"></script>
<script src="system-preferences.js"></script>
<script src="photos.js"></script>
<script src="calendar.js"></script>
<script src="music.js"></script>
<script src="github.js"></script>
<script src="maps.js"></script>  
<script src="menubar.js"></script>
<script src="messages.js"></script>
<script src="safari.js"></script>
<script src="lockscreen.js"></script>
<script src="contextmenu.js"></script>
<script src="terminal.js"></script>
</body>
</html>
